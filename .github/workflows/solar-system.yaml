name: solar-system-feb

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{vars.USERNAME}}
    MONGO_PASSWORD: ${{secrets.PASSWORD}}

jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
            node-version: ['18','19']
            os-version: [ubuntu-latest, macos-latest]
            exclude:
              - node-version: '18'
                os-version: macos-latest
          fail-fast: false
        runs-on: ${{matrix.os-version}}
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
          
          - name: Install NodeJS on ${{matrix.node-version}}
            uses: actions/setup-node@v4
            with:
              node-version: ${{matrix.node-version}}

          - name: Install Dependencies
            run: npm install
          
          - name: Nodeversion
            run: node -v

          - name: Run Unit Tests
            id: unit-test-run
            run: npm run test
          
          - name: Upload Articraft
            #if: steps.unit-test-run.outcome == 'failure' || steps.unit-test-run.outcome == 'success'
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: Code-test-Result-${{matrix.node-version}}-${{matrix.os-version}}
              path: test-report.xml
              retention-days: 10
    code-coverage:
        name: code-coverage
        runs-on: ubuntu-latest
        steps:
          - name: Checkout-Code
            uses: actions/checkout@v4

          - name: Install nodejs
            uses: actions/setup-node@v4
            with:
              node-version: 18

          - name: Install Dependencies
            run: npm install
          
          - name: Run unit Coverage
            continue-on-error: true
            run:  npm run coverage
          
          - name: Archive Coverage Result
            uses: actions/upload-artifact@v4
            with:
                name: Code-Coverage-Test
                path: coverage
                retention-days: 14
    deploy:
      name: Deployment
      needs: code-coverage
      runs-on: ubuntu-latest
      steps:
        - name: Echo Deploy
          run: echo "Deployment in progress on ${{runner.os}}"