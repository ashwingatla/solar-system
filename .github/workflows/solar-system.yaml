name: solar-system-ci

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{vars.USERNAME}}
    MONGO_PASSWORD: ${{secrets.PASSWORD}}

jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
            node-version: ['18','19','20']
            os-version: [ubuntu-latest, macos-latest]
            excludes:
              - node-version: 18
                os-version: macos-latest
          fail-fast: false
        runs-on: ${{matrix.os-version}}
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
          
          - name: Install NodeJS on ${{matrix.node-version}}
            uses: actions/setup-node@v4
            with:
              node-version: ${{matrix.node-version}}

          - name: Install Dependencies
            run: npm install

          - name: Run Unit Tests
            run: npm test
          
          - name: Upload Articraft
            uses: actions/upload-artifact@v4
            with:
              name: Mocha Test Results
              path: test-results.xml