name: solar-unit-testing
on:
    workflow_dispatch: 
    push:
        branches:
            - main
            - feature/*
jobs:
    unit-testing:
        runs-on: ubuntu-latest
        steps:
            - name: checkout-repo
              uses: actions/checkout@v4
            - name: NodeJS Installation
              uses: actions/setup-node@v6
              with:
                node-version: 18
            - name: Run NPM Install
              run: npm install
            - name: Run Unit Test
              run: npm test